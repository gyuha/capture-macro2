[project]
name = "capture-macro"
version = "0.2.1"
description = "Screen capture macro tool with OCR support"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7.2",
    "pillow>=10.4.0",
    "mss>=9.0.2",
    "pynput>=1.7.7",
    "pytesseract>=0.3.13",
    "opencv-python>=4.10.0.84",
    "scikit-image>=0.24.0",
    "scipy>=1.14.1",
    "numpy>=2.1.1",
    "reportlab>=4.2.2",
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.3",
    "PyYAML>=6.0.2",
    "imageio>=2.35.1",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.10.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
